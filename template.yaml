AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Serverless task API built with AWS SAM

Globals:
  Function:
    Runtime: python3.12
    Timeout: 5
    MemorySize: 128

Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/create_task/
      Handler: app.lambda_handler

      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable

      Events:
        CreateTask:
          Type: HttpApi
          Properties:
            Path: /tasks
            Method: POST

Outputs:
  TasksTableName:
    Description: Name of the DynamoDB tasks table
    Value: !Ref TasksTable
