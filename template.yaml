AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Serverless task API built with AWS SAM

Globals:
  Function:
    Runtime: python3.12
    Timeout: 5
    MemorySize: 128
  HttpApi:
    Auth:
      Authorizers:
        CognitoJwtAuthorizer:
          AuthorizationScopes:
            - aws.cognito.signin.user.admin
          IdentitySource: "$request.header.Authorization"
          JwtConfiguration:
            issuer: !Sub >-
              https://cognito-idp.${AWS::Region}.amazonaws.com/${TaskUserPool}
            audience:
              - !Ref TaskUserPoolClient
      DefaultAuthorizer: CognitoJwtAuthorizer

Resources:
  TaskUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  TaskUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref TaskUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: create_task.app.lambda_handler

      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
          LOCAL_DYNAMODB_ENABLED: "false"
          DYNAMODB_ENDPOINT: ""
          LOCAL_AUTH_ENABLED: "false"
          LOCAL_AUTH_TOKEN: ""

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable

      Events:
        CreateTask:
          Type: HttpApi
          Properties:
            Path: /tasks
            Method: POST
        ListTasks:
          Type: HttpApi
          Properties:
            Path: /tasks
            Method: GET
        GetTask:
          Type: HttpApi
          Properties:
            Path: /tasks/{id}
            Method: GET

Outputs:
  ApiUrl:
    Description: URL of the JWT-protected task API
    Value: !Sub >-
      https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UserPoolId:
    Description: Cognito user pool ID
    Value: !Ref TaskUserPool
  UserPoolClientId:
    Description: Cognito public app client ID
    Value: !Ref TaskUserPoolClient
  TasksTableName:
    Description: Name of the DynamoDB tasks table
    Value: !Ref TasksTable